version: '3.8'

services:
  app:
    build: .
    environment:
      - DATABASE_URL=postgresql://pulse_user:pulse_password@db:5432/pulse_db
      - NODE_ENV=production
    depends_on:
      - db
    restart: always
    networks:
      - n8n_default
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pulse3d-web.rule=Host(`pulse3d.ru`) || Host(`www.pulse3d.ru`)"
      - "traefik.http.routers.pulse3d-web.entrypoints=websecure"
      - "traefik.http.routers.pulse3d-web.tls=true"
      - "traefik.http.routers.pulse3d-web.tls.certresolver=ls"
      - "traefik.http.services.pulse3d-web.loadbalancer.server.port=3000"

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: pulse_user
      POSTGRES_PASSWORD: pulse_password
      POSTGRES_DB: pulse_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - default

networks:
  n8n_default:
    external: true

volumes:
  pg_data:
